spring.application.name=ai-service
server.port=9098
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info
qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6333}
qdrant.collection=${QDRANT_COLLECTION:ecommerce_products}
ai.api-key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.chat-model=${AI_CHAT_MODEL:gpt-4o-mini}
ai.embedding-model=${AI_EMBEDDING_MODEL:text-embedding-3-small}
ai.embedding-dimensions=${AI_EMBEDDING_DIMENSIONS:1536}
