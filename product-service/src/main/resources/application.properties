spring.application.name=product-service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=9093

# Database
spring.datasource.url=${PRODUCT_DB_URL:jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Eureka Client

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Eureka Instance

eureka.instance.prefer-ip-address=true

# === AWS S3 ===
aws.s3.region=eu-north-1
aws.s3.bucket-name=mantosh-ecommerce-images-2026

# Upload limits; S3ServiceImpl only permits JPEG, PNG, and WEBP files.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.org.springframework.security=INFO

# Redis & Caching
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
