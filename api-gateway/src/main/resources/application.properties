spring.application.name=api-gateway
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=8080
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
security.jwt.secret=${JWT_SECRET}
management.endpoints.web.exposure.include=health,info,gateway
spring.cloud.gateway.server.webmvc.routes[0].id=auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webmvc.routes[1].id=products
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.server.webmvc.routes[2].id=cart
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://cart-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/carts/**
spring.cloud.gateway.server.webmvc.routes[3].id=orders
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.server.webmvc.routes[4].id=payments
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.server.webmvc.routes[5].id=addresses
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/addresses/**
spring.cloud.gateway.server.webmvc.routes[6].id=ai
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://ai-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/ai/**
