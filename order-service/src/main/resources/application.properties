spring.application.name=order-service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=9095
spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.order.event.PaymentCompletedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
