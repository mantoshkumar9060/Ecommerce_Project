<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#111827}.sub{font:16px Arial,sans-serif;fill:#4b5563}.box{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:14}.infra{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:14}.data{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.event{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}.label{font:700 17px Arial,sans-serif;fill:#111827}.small{font:14px Arial,sans-serif;fill:#374151}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#9333ea;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Full-Stack E-Commerce Microservices Architecture</text>
  <text x="60" y="88" class="sub">Angular Storefront • Spring Boot Microservices • Eureka • Kafka • MySQL • AWS S3 • Docker</text>

  <rect x="70" y="270" width="190" height="120" class="box"/><text x="105" y="315" class="label">Angular Storefront</text><text x="103" y="345" class="small">Customer UI</text>
  <rect x="340" y="270" width="210" height="120" class="infra"/><text x="380" y="315" class="label">API Gateway</text><text x="385" y="345" class="small">Routing + Security</text>
  <rect x="650" y="70" width="210" height="90" class="infra"/><text x="704" y="110" class="label">Eureka Server</text><text x="692" y="135" class="small">Service Discovery</text>

  <rect x="650" y="200" width="210" height="70" class="box"/><text x="710" y="243" class="label">Auth Service</text>
  <rect x="650" y="300" width="210" height="70" class="box"/><text x="690" y="343" class="label">Product Service</text>
  <rect x="650" y="400" width="210" height="70" class="box"/><text x="710" y="443" class="label">Cart Service</text>
  <rect x="650" y="500" width="210" height="70" class="box"/><text x="700" y="543" class="label">Order Service</text>
  <rect x="650" y="600" width="210" height="70" class="box"/><text x="695" y="643" class="label">Payment Service</text>
  <rect x="950" y="500" width="230" height="70" class="box"/><text x="970" y="543" class="label">Notification Service</text>

  <rect x="1080" y="130" width="200" height="90" class="data"/><text x="1148" y="170" class="label">MySQL</text><text x="1128" y="197" class="small">Transactional Data</text>
  <rect x="1080" y="280" width="200" height="90" class="event"/><text x="1148" y="320" class="label">Kafka</text><text x="1117" y="347" class="small">Async Events</text>
  <rect x="1080" y="650" width="200" height="90" class="data"/><text x="1148" y="690" class="label">AWS S3</text><text x="1120" y="717" class="small">Product Images</text>

  <path d="M260 330 H340" class="line"/>
  <path d="M550 330 H610 V235 H650" class="line"/><path d="M610 330 V335 H650" class="line"/><path d="M610 330 V435 H650" class="line"/><path d="M610 330 V535 H650" class="line"/><path d="M610 330 V635 H650" class="line"/>
  <path d="M445 270 V160 H650" class="dash"/><path d="M755 200 V160" class="dash"/><path d="M755 300 V160" class="dash"/><path d="M755 400 V160" class="dash"/><path d="M755 500 V160" class="dash"/><path d="M755 600 V160" class="dash"/><path d="M1065 500 V160 H860" class="dash"/>
  <path d="M860 335 H1080" class="line"/><path d="M860 435 H1080" class="line"/><path d="M860 535 H1080" class="line"/><path d="M860 635 H1080" class="line"/>
  <path d="M860 635 H950 V535" class="dash"/><path d="M860 535 H1080 V325" class="dash"/><path d="M860 335 H1080 V695" class="line"/>
  <path d="M860 535 H950" class="dash"/><path d="M950 535 H860" class="dash"/>

  <rect x="70" y="730" width="1210" height="50" fill="#ffffff" stroke="#cbd5e1" rx="10"/>
  <text x="100" y="762" class="small">Solid arrows: synchronous HTTP/REST communication</text><text x="600" y="762" class="small">Dashed arrows: service discovery / asynchronous event flow</text>
</svg>